---
- name: "🖧 Підготувати скрипт для додавання вузлів"
  copy:
    dest: "/tmp/gns3_add_nodes.py"
    mode: "0755"
    content: |
      #!/usr/bin/env python3
      import json, uuid

      project_file = "{{ gns3_project_file }}"

      with open(project_file, 'r') as f:
          project = json.load(f)

      existing_names = {n["name"] for n in project["topology"]["nodes"]}

      # Topology: 4 routers + 2 user PCs + 1 perimeter PC + 3 DMZ servers
      all_nodes = [
          # Routers
          {"name": "R1",           "x": 400, "y": 300,  "console": 5001, "symbol": ":/symbols/router.svg"},
          {"name": "R2",           "x": 150, "y": 500,  "console": 5002, "symbol": ":/symbols/router.svg"},
          {"name": "R3",           "x": 400, "y": 100,  "console": 5003, "symbol": ":/symbols/router.svg"},
          {"name": "R4",           "x": 650, "y": 500,  "console": 5004, "symbol": ":/symbols/router.svg"},
          # User PCs (Access zone, R2)
          {"name": "PC1",          "x": 50,  "y": 700,  "console": 5010, "symbol": ":/symbols/computer.svg"},
          {"name": "PC2",          "x": 250, "y": 700,  "console": 5011, "symbol": ":/symbols/computer.svg"},
          # Perimeter PC (R3)
          {"name": "PC-PERIMETER", "x": 400, "y": -100, "console": 5012, "symbol": ":/symbols/computer.svg"},
          # DMZ servers (R4)
          {"name": "SRV-WEB",      "x": 500, "y": 700,  "console": 5020, "symbol": ":/symbols/server.svg"},
          {"name": "SRV-REDIS",    "x": 650, "y": 700,  "console": 5021, "symbol": ":/symbols/server.svg"},
          {"name": "SRV-DB",       "x": 800, "y": 700,  "console": 5022, "symbol": ":/symbols/server.svg"},
      ]

      added = []
      for r in all_nodes:
          if r["name"] in existing_names:
              continue
          node = {
              "compute_id":       "local",
              "console":          r["console"],
              "console_type":     "telnet",
              "custom_adapters":  [],
              "first_port_name":  None,
              "height":           59,
              "label": {
                  "rotation": 0,
                  "style": "font-family: DejaVu Sans Mono;font-size: 10.0;font-weight: bold;fill: #2e3436;fill-opacity: 1.0",
                  "text": r["name"],
                  "x": -25,
                  "y": -25
              },
              "locked":    False,
              "name":      r["name"],
              "node_id":   str(uuid.uuid4()),
              "node_type": "qemu",
              "properties": {
                  "adapters": 4,
                  "memory":   256,
                  "name":     r["name"]
              },
              "x":      r["x"],
              "y":      r["y"],
              "width":  72,
              "symbol": r["symbol"]
          }
          project["topology"]["nodes"].append(node)
          added.append(r["name"])

      with open(project_file, 'w') as f:
          json.dump(project, f, indent=2)

      if added:
          print("Added nodes: " + ", ".join(added))
      else:
          print("All nodes already present")

- name: "🖧 Додати всі вузли топології до GNS3 проекту"
  command: python3 /tmp/gns3_add_nodes.py
  register: add_nodes_result

- name: "✅ Вузли додано до JSON"
  debug:
    msg: "{{ add_nodes_result.stdout }}"

