<!DOCTYPE html>
<html lang="uk" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GNS3 Dashboard{% endblock %}</title>
  <!-- Bootstrap 5 dark theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-hdd-network-fill text-info me-2"></i>GNS3 Dashboard
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/topology' %}active{% endif %}" href="/topology">
            <i class="bi bi-diagram-3 me-1"></i>Topology
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/validation' %}active{% endif %}" href="/validation">
            <i class="bi bi-check-circle me-1"></i>Validation
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/scan' %}active{% endif %}" href="/scan">
            <i class="bi bi-search me-1"></i>Scan
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/config' %}active{% endif %}" href="/config">
            <i class="bi bi-file-earmark-code me-1"></i>Config
          </a>
        </li>
      </ul>
      <span class="navbar-text small" id="ws-status">
        <span class="badge bg-secondary"><i class="bi bi-circle-fill me-1"></i>Connecting…</span>
      </span>
    </div>
  </div>
</nav>

<!-- Main content -->
<div class="container-fluid py-4 px-4">
  {% block content %}{% endblock %}
</div>

<!-- Toast container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
