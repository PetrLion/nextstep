<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}GNS3 Security Dashboard{% endblock %}</title>

  <!-- Bootstrap 5 dark -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Custom styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark" id="main-navbar">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">
      <i class="fa-solid fa-shield-halved me-2 text-accent"></i>GNS3 Security Dashboard
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="/">
            <i class="fa-solid fa-gauge-high me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'topology' %}active{% endif %}" href="/topology">
            <i class="fa-solid fa-network-wired me-1"></i>Topology
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'results_page' %}active{% endif %}" href="/results">
            <i class="fa-solid fa-list-check me-1"></i>Results
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'settings' %}active{% endif %}" href="/settings">
            <i class="fa-solid fa-gear me-1"></i>Settings
          </a>
        </li>
      </ul>
      <span class="ms-3" id="ws-indicator" title="WebSocket status">
        <i class="fa-solid fa-circle text-secondary" style="font-size:0.65rem;"></i>
      </span>
    </div>
  </div>
</nav>

<!-- Toast container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

<!-- Page content -->
<main class="container-fluid py-4">
  {% block content %}{% endblock %}
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Socket.IO -->
<script src="https://cdn.jsdelivr.net/npm/socket.io@4.7.4/client-dist/socket.io.min.js"></script>
<!-- App JS -->
<script src="{{ url_for('static', filename='js/websocket.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
